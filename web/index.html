<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Video Retrieval</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Interactive Video Retrieval</h1>

  <section>
    <form id="searchForm">
      <textarea id="query" rows="3" required
        placeholder="KIS-T: one visual line per shot, in order. AVS: one phrasing per line."></textarea>
      <select id="mode" aria-label="Search mode">
        <option value="kist">KIS-T (sequence)</option>
        <option value="avs">AVS (combined)</option>
      </select>
      <button type="submit">Search</button>
    </form>
    <div id="imageBox">
      KIS-V: paste screenshots (Ctrl+V)
      <span id="imageCount"></span>
      <button id="imageClear" type="button" disabled>Clear images</button>
    </div>
    <p id="status"></p>
  </section>

  <div class="layout">
    <section>
      <h2 id="resultsTitle">Results</h2>
      <button id="backButton" type="button" hidden>Back to search results</button>
      <p>
        <span id="batchCount">0</span> selected
        <button id="batchSubmit" type="button" disabled>Submit selected</button>
        <button id="newTask" type="button">New task</button>
      </p>
      <div id="results" class="grid"></div>
    </section>

    <section>
      <h2 id="selectedTitle">No shot selected</h2>
      <video id="player" controls preload="metadata"></video>
      <p id="playerStatus"></p>
      <button id="previous" type="button" disabled>← Previous shot</button>
      <button id="next" type="button" disabled>Next shot →</button>
      <button id="allShots" type="button" disabled>All shots in video</button>
      <button id="similar" type="button" disabled>More like this</button>

      <h2>DRES</h2>
      <p>
        <button id="connect" type="button">1. Connect</button>
        <select id="evaluation" disabled aria-label="Evaluation"><option value="">2. Choose evaluation</option></select>
      </p>
      <p id="dresStatus">Not connected.</p>
      <p>
        <label>Start (ms) <input id="startMs" type="number" min="0"></label>
        <button id="setStart" type="button" disabled>Set from player</button>
      </p>
      <p>
        <label>End (ms) <input id="endMs" type="number" min="0"></label>
        <button id="setEnd" type="button" disabled>Set from player</button>
      </p>
      <button id="submit" type="button" disabled>3. Submit answer</button>
      <pre id="reply"></pre>
    </section>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
